    <title>Mechatronian | Team Hub</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ee87ca2c-bd88-4bbf-aa71-15ac6c6fd7ad",
          safari_web_id: "web.onesignal.auto.166712e5-2aee-41ea-b95e-8df3d8ab1f28",
          serviceWorkerPath: 'sw.js?v=3', // Forced update
          notifyButton: {
            enable: false,
          },
        });
      });
    </script>
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      font-family: 'Outfit', sans-serif;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      animation: splash-in 1s ease-out;
    }
    .splash-logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-logo-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #C0C0C0;
      border-radius: 20px;
      transform: rotate(45deg);
      opacity: 0.15;
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-title {
      font-family: 'Righteous', cursive;
      font-size: 2.5rem;
      color: #f5f5f7;
      margin: 0;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #f5f5f7, #007AFF, #f5f5f7);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    .splash-loader {
      width: 40px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader-bar {
      position: absolute;
      width: 50%;
      height: 100%;
      background: #007AFF;
      animation: loading 1.5s infinite ease-in-out;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: rotate(45deg) scale(1); opacity: 0.15; }
      50% { transform: rotate(45deg) scale(1.1); opacity: 0.3; }
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }
    @keyframes loading {
      0% { left: -50%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-container">
        <div class="splash-logo-bg"></div>
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 18V6L12 14L20 6V18" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="14" r="1" fill="white" />
          <circle cx="4" cy="6" r="1" fill="white" />
          <circle cx="20" cy="6" r="1" fill="white" />
          <circle cx="4" cy="18" r="1" fill="white" />
          <circle cx="20" cy="18" r="1" fill="white" />
        </svg>
      </div>
      <h1 class="splash-title">Mechatronian</h1>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>
  <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
